# Persistent docs: README, tutorial, how-to, reference, migration guide.
# Slop (blocking) + Google (advisory except mechanical formatting).
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop, Google
# Pedantic for dev docs — advisory only:
Google.Latin = warning
Google.Parens = suggestion
Google.We = warning
# Headings rules fight repo conventions sometimes — advisory:
Google.Headings = suggestion
Google.EmDash = warning
