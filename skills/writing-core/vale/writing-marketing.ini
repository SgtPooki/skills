# Persuasion-first broadcast copy: pitches, cold email, promo posts, launch copy.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop, Google, Marketing
# Marketing copy is warm, personal, and second-person by design:
Google.Exclamation = warning
Google.We = suggestion
Google.FirstPerson = suggestion
Google.Will = suggestion
Google.Latin = warning
Google.Headings = suggestion
Google.EmDash = warning
# The skill demands measured specifics ("4.2s -> 300ms"); typography nits on
# units must not block them:
Google.Units = suggestion
