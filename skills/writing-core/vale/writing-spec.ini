# ADRs, RFCs, design specs, requirements. High-jargon precise register.
# Slop only — Google's conversational rules (contractions, "we", no "will")
# fight normative spec language. RFC 2119 keywords (MUST/SHOULD/MAY) are allowed.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop
# Specs legitimately compare options — vague-quantifier stays advisory here:
Slop.VagueQuantifier = suggestion
